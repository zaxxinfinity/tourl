<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hand Tracking - 2 Hands 4 Fingers</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

video {
    display: none;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
}

#status {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    background: rgba(0,0,0,0.7);
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 10;
}

#controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
}

button {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: #3d8b40;
}
</style>
</head>
<body>

<div class="container">
    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas"></canvas>
    <div id="status">🔍 Waiting for 2 hands...</div>
    <div id="controls">
        <button onclick="resetPanel()">🔄 Reset Panel</button>
    </div>
</div>

<script>

// ============ DOM ELEMENTS ============
const video = document.querySelector(".input_video");
const canvas = document.querySelector(".output_canvas");
const ctx = canvas.getContext("2d");
const statusDiv = document.getElementById("status");

// ============ CANVAS SIZE ============
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// ============ PANEL STATE ============
let panel = {
    x: canvas.width / 2 - 150,
    y: canvas.height / 2 - 100,
    width: 300,
    height: 200,
    rotation: 0,
    active: false,
    lastUpdate: 0
};

// Smoothing targets
let targetPanel = { ...panel };

// Touch points (4 fingers)
let touchPoints = [];

// ============ CREATE PANEL OVERLAY ============
function createPanelImage() {
    const panelCanvas = document.createElement('canvas');
    panelCanvas.width = 600;
    panelCanvas.height = 400;
    const pCtx = panelCanvas.getContext('2d');
    
    // Background
    pCtx.fillStyle = 'rgba(20, 40, 80, 0.8)';
    pCtx.fillRect(0, 0, 600, 400);
    
    // Border
    pCtx.strokeStyle = '#00ff88';
    pCtx.lineWidth = 4;
    pCtx.strokeRect(5, 5, 590, 390);
    
    // Grid
    pCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    pCtx.lineWidth = 1;
    
    for (let x = 0; x <= 600; x += 50) {
        pCtx.beginPath();
        pCtx.moveTo(x, 0);
        pCtx.lineTo(x, 400);
        pCtx.stroke();
    }
    
    for (let y = 0; y <= 400; y += 50) {
        pCtx.beginPath();
        pCtx.moveTo(0, y);
        pCtx.lineTo(600, y);
        pCtx.stroke();
    }
    
    // Corner handles
    const corners = [[10,10], [570,10], [10,370], [570,370]];
    corners.forEach(([x, y]) => {
        pCtx.fillStyle = '#00ff88';
        pCtx.fillRect(x, y, 20, 20);
        pCtx.strokeStyle = 'white';
        pCtx.lineWidth = 2;
        pCtx.strokeRect(x, y, 20, 20);
    });
    
    return panelCanvas;
}

const panelImage = createPanelImage();

// ============ RESET PANEL ============
function resetPanel() {
    panel = {
        x: canvas.width / 2 - 150,
        y: canvas.height / 2 - 100,
        width: 300,
        height: 200,
        rotation: 0,
        active: false,
        lastUpdate: 0
    };
    targetPanel = { ...panel };
    touchPoints = [];
    statusDiv.textContent = '🔄 Panel Reset';
}

// ============ HANDS SETUP ============
const hands = new Hands({
    locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 2,           // 2 tangan
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5
});

// ============ MAIN LOOP ============
hands.onResults(results => {
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw camera feed (optional, bisa dihapus biar gelap)
    // ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    
    const landmarks = results.multiHandLandmarks;
    
    if (landmarks && landmarks.length >= 2) {
        // ===== 2 TANGAN TERDETEKSI =====
        statusDiv.textContent = '✋✋ 2 Hands - Panel Active';
        
        const hand1 = landmarks[0];
        const hand2 = landmarks[1];
        
        // Ambil 4 jari: index+thumb dari masing-masing tangan
        touchPoints = [
            { x: hand1[8].x * canvas.width, y: hand1[8].y * canvas.height, id: 'H1-Index' },
            { x: hand1[4].x * canvas.width, y: hand1[4].y * canvas.height, id: 'H1-Thumb' },
            { x: hand2[8].x * canvas.width, y: hand2[8].y * canvas.height, id: 'H2-Index' },
            { x: hand2[4].x * canvas.width, y: hand2[4].y * canvas.height, id: 'H2-Thumb' }
        ];
        
        // Update panel dari 4 titik
        updatePanelFromTouchPoints();
        panel.active = true;
        panel.lastUpdate = Date.now();
        
        // Gambar tangan
        drawHands(landmarks);
        
    } else if (landmarks && landmarks.length === 1) {
        statusDiv.textContent = '👆 Need 2 hands (1 detected)';
        drawHands(landmarks);
        touchPoints = [];
        
    } else {
        statusDiv.textContent = '🔍 No hands detected';
        touchPoints = [];
        
        // Auto reset after 2 seconds
        if (panel.active && Date.now() - panel.lastUpdate > 2000) {
            panel.active = false;
        }
    }
    
    // Smooth panel
    smoothPanel();
    
    // Draw panel
    if (panel.active || touchPoints.length >= 4) {
        drawPanel();
    }
    
    // Draw touch points
    drawTouchPoints();
});

// ============ UPDATE PANEL DARI 4 TITIK ============
function updatePanelFromTouchPoints() {
    if (touchPoints.length < 4) return;
    
    const [p1, p2, p3, p4] = touchPoints;
    
    // Center dari 4 titik
    const cx = (p1.x + p2.x + p3.x + p4.x) / 4;
    const cy = (p1.y + p2.y + p3.y + p4.y) / 4;
    
    // Diagonal untuk scale
    const d1 = Math.hypot(p1.x - p4.x, p1.y - p4.y);
    const d2 = Math.hypot(p2.x - p3.x, p2.y - p3.y);
    const avgDiag = (d1 + d2) / 2;
    
    const baseDiag = Math.hypot(300, 200);
    const scale = Math.max(0.3, Math.min(3, avgDiag / baseDiag));
    
    // Rotasi dari tangan pertama
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    
    // Target panel
    const w = 300 * scale;
    const h = 200 * scale;
    
    targetPanel = {
        x: cx - w / 2,
        y: cy - h / 2,
        width: w,
        height: h,
        rotation: angle
    };
}

// ============ SMOOTHING ============
function smoothPanel() {
    const factor = 0.7;
    
    panel.x += (targetPanel.x - panel.x) * (1 - factor);
    panel.y += (targetPanel.y - panel.y) * (1 - factor);
    panel.width += (targetPanel.width - panel.width) * (1 - factor);
    panel.height += (targetPanel.height - panel.height) * (1 - factor);
    
    // Rotasi smoothing
    let dr = targetPanel.rotation - panel.rotation;
    while (dr > Math.PI) dr -= Math.PI * 2;
    while (dr < -Math.PI) dr += Math.PI * 2;
    panel.rotation += dr * (1 - factor);
}

// ============ DRAW PANEL ============
function drawPanel() {
    ctx.save();
    
    const cx = panel.x + panel.width / 2;
    const cy = panel.y + panel.height / 2;
    
    ctx.translate(cx, cy);
    ctx.rotate(panel.rotation);
    ctx.translate(-cx, -cy);
    
    // Shadow
    ctx.shadowColor = 'rgba(0, 255, 136, 0.5)';
    ctx.shadowBlur = 20;
    
    // Draw panel image
    ctx.drawImage(
        panelImage,
        panel.x,
        panel.y,
        panel.width,
        panel.height
    );
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// ============ DRAW TOUCH POINTS ============
function drawTouchPoints() {
    touchPoints.forEach(point => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Label
        ctx.fillStyle = 'white';
        ctx.font = '12px Arial';
        ctx.fillText(point.id, point.x + 15, point.y);
    });
}

// ============ DRAW HANDS ============
function drawHands(landmarksArray) {
    landmarksArray.forEach((landmarks, handIndex) => {
        
        // Connections
        const connections = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [5, 9], [9, 10], [10, 11], [11, 12],
            [9, 13], [13, 14], [14, 15], [15, 16],
            [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const color = handIndex === 0 ? '#00ff88' : '#ff8800';
        
        // Draw lines
        connections.forEach(([start, end]) => {
            const sp = landmarks[start];
            const ep = landmarks[end];
            
            ctx.beginPath();
            ctx.moveTo(sp.x * canvas.width, sp.y * canvas.height);
            ctx.lineTo(ep.x * canvas.width, ep.y * canvas.height);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
        });
        
        // Draw points
        landmarks.forEach((point, index) => {
            const x = point.x * canvas.width;
            const y = point.y * canvas.height;
            const isFinger = [4, 8, 12, 16, 20].includes(index);
            
            ctx.beginPath();
            ctx.arc(x, y, isFinger ? 8 : 5, 0, Math.PI * 2);
            ctx.fillStyle = isFinger ? '#ffff00' : color;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.stroke();
        });
    });
}

// ============ START CAMERA ============
const camera = new Camera(video, {
    onFrame: async () => {
        await hands.send({ image: video });
    },
    width: 640,
    height: 480
});

camera.start();
console.log('✅ Camera started successfully');

</script>
</body>
  </html>
